# Docker-on-DomU runtime support.
#
# The DomU rootfs installs docker-moby so Topo can deploy containers into the
# Linux guest, but the measured image had Docker fail before it could answer
# `docker info`:
#   - overlay2: "failed to mount overlay: no such device"
#   - bridge/NAT: ip_tables/iptable_nat/bridge modules absent from /lib/modules
#
# Build these in, not as modules. The shipping DomU rootfs is the AGL partition,
# while the booted kernel is supplied separately as linux-domu on p1. A measured
# image booted a 6.8.0-rc1 kernel against a rootfs containing /lib/modules for a
# different 6.6 kernel, so module packages alone cannot make Docker reliable.
CONFIG_OVERLAY_FS=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_VETH=y
CONFIG_MACVLAN=y
CONFIG_DUMMY=y

CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NETFILTER_XTABLES=y
CONFIG_NETFILTER_XT_NAT=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_MATCH_MARK=y
CONFIG_NETFILTER_XT_MATCH_TCPUDP=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_MANGLE=y
CONFIG_IP_NF_TARGET_MASQUERADE=y

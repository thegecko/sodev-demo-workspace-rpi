# Docker-on-DomU runtime support.
#
# The DomU rootfs installs docker-moby so Topo can deploy containers into the
# Linux guest, but the measured image had Docker fail before it could answer
# `docker info`:
#   - overlay2: "failed to mount overlay: no such device"
#   - bridge/NAT: ip_tables/iptable_nat/bridge modules absent from /lib/modules
#
# Keep these as modules so the small virtio guest kernel stays minimal, but make
# the intent explicit here and pull the matching kernel-module-* packages into
# the DomU image.
CONFIG_OVERLAY_FS=m
CONFIG_BRIDGE=m
CONFIG_BRIDGE_NETFILTER=m
CONFIG_VETH=m
CONFIG_MACVLAN=m
CONFIG_DUMMY=m

CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NETFILTER_XTABLES=m
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=m
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_NETFILTER_XT_MATCH_MARK=m
CONFIG_NETFILTER_XT_MATCH_TCPUDP=m
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_IP_NF_IPTABLES=m
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_NAT=m
CONFIG_IP_NF_MANGLE=m
CONFIG_IP_NF_TARGET_MASQUERADE=m

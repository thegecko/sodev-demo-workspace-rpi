# SPDX-License-Identifier: MIT
# DomD's real radio. The device-console service drives this over the control
# socket mounted from DomD as /host/run/wpa_supplicant, and optional DomA support
# can drive the same socket through domd_wifi_agent.py.
#
# No network block is shipped here. The UI/API creates networks explicitly; a
# wildcard open-network block would let the board associate with an arbitrary AP.
ctrl_interface=/run/wpa_supplicant
update_config=1

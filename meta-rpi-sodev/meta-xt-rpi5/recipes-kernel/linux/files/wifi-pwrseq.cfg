# RPi5 BCM43455 SDIO Wi-Fi reset sequencing.
#
# boot.cmd.xen.linux-dom0.in adds an mmc-pwrseq-simple node for the radio's
# WL_ON/reset GPIO and attaches it to /axi/mmc@1100000. Keep the driver built in
# so the MMC core can sequence the non-removable card during its first probe,
# before userspace or module autoloading can help.
CONFIG_MMC_PWRSEQ=y
CONFIG_MMC_PWRSEQ_SIMPLE=y
